<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Agent Terminal Web</title>
    <link rel="icon" href="/favicon.svg?v=20260710-1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260710-1" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260710-1" />
    <style>
      :root {
        color-scheme: light;
        background: #faf9f7;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        width: 100%;
        background: #faf9f7;
        background-color: #faf9f7;
        color: #332f2c;
      }

      body,
      .app,
      .session-screen {
        background: #faf9f7;
      }


      #platform-session-application {
        height: 100dvh;
        min-height: 0;
      }
    </style>
    <link rel="stylesheet" href="/agent-memories.css?v=20261003-change-timeline-1" />
    <link rel="stylesheet" href="/agent-integrations.css?v=20260825-custom-keys-1" />
    <link rel="stylesheet" href="/generated/session-app.css" />
  </head>
  <body>
    <main id="platform-session-application" aria-label="Agent Web"></main>
    <dialog id="integrations-dialog" class="integrations-dialog" aria-labelledby="integrations-title">
      <section class="integrations-shell">
        <header>
          <div>
            <span>Write-only credentials</span>
            <h2 id="integrations-title">外部集成</h2>
          </div>
          <button id="integrations-close" class="dialog-close" type="button" aria-label="关闭">×</button>
        </header>
        <p class="integrations-intro">
          凭证保存后不会再次显示。自定义 Key 只负责保管，具体使用方式由项目自行决定。
        </p>
        <div id="integrations-content" class="integrations-content" aria-live="polite"></div>
      </section>
    </dialog>
    <dialog id="memory-dialog" class="memory-dialog" aria-labelledby="memory-title">
      <form method="dialog">
        <header>
          <div>
            <span>Memory System · 自动沉淀</span>
            <h2 id="memory-title">记忆与规则</h2>
          </div>
          <div class="memory-header-actions">
            <button id="memory-refresh" type="button">刷新</button>
            <button id="memory-close" type="button" aria-label="关闭">×</button>
          </div>
        </header>
        <div class="memory-summary-bar">
          <span id="memory-context">Core、Now 与按需 Topics</span>
          <strong id="memory-status" class="memory-status">正在读取</strong>
        </div>
        <section id="memory-project-routing" class="memory-project-routing hidden" aria-label="当前 Session 的项目记忆">
          <div class="memory-project-routing-header">
            <div>
              <strong>本 Session 使用的项目记忆</strong>
              <span id="memory-project-routing-note">自动按对话识别，workspace 只负责文件范围</span>
            </div>
            <button id="memory-project-auto" type="button">恢复自动</button>
          </div>
          <div id="memory-project-options" class="memory-project-options"></div>
        </section>
        <nav class="memory-tabs" role="tablist" aria-label="记忆视图">
          <button class="active" type="button" role="tab" aria-selected="true" data-memory-view="overview">个人记忆</button>
          <button type="button" role="tab" aria-selected="false" data-memory-view="detail">项目规则</button>
          <button type="button" role="tab" aria-selected="false" data-memory-view="changes">变更记录</button>
        </nav>
        <section id="memory-content" class="memory-content" aria-live="polite"></section>
      </form>
    </dialog>
    <script src="/vendor/markdown-it/markdown-it.min.js?v=14.3.0"></script>
    <script src="/app-markdown.js?v=20260825-mobile-files-1"></script>
    <script src="/agent-memories.js?v=20261003-change-timeline-1"></script>
    <script src="/agent-integrations.js?v=20260825-custom-keys-1"></script>
    <script src="/shared/voice-recovery-store.js?v=20260717-2"></script>
    <script src="/shared/voice-capture-widget.js?v=20260717-recovery-3"></script>
    <script type="module">
      import("/generated/session-app.js")
        .then(() => document.body.classList.add("platform-session-ready"))
        .catch((error) => document.querySelector('#platform-session-application').textContent = '界面资源加载失败，请构建 Session UI 后刷新。');
    </script>
  </body>
</html>
