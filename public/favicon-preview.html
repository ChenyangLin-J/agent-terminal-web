<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Favicon Preview</title>
    <link rel="icon" href="/favicon-options/prompt.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/favicon-preview.css?v=1" />
  </head>
  <body>
    <main>
      <header>
        <a href="/" aria-label="返回 Agent">&larr;</a>
        <div>
          <h1>Agent Favicon</h1>
          <p>三个方向，按真实尺寸对比。</p>
        </div>
      </header>

      <section class="concepts" aria-label="Favicon concepts">
        <article>
          <div class="concept-heading">
            <span class="number">1</span>
            <div>
              <h2>Prompt</h2>
              <p>克制、直接，最像 Codex Terminal。</p>
            </div>
          </div>
          <div class="hero-icon dark-grid">
            <img src="/favicon-options/prompt.svg" alt="深色底、白色提示符和蓝色光标" />
          </div>
          <div class="sizes" aria-label="Prompt at actual sizes">
            <div><img class="size-32" src="/favicon-options/prompt.svg" alt="" /><span>32</span></div>
            <div><img class="size-16" src="/favicon-options/prompt.svg" alt="" /><span>16</span></div>
          </div>
          <div class="browser-tab">
            <img src="/favicon-options/prompt.svg" alt="" />
            <span>Agent · workspace</span>
            <b>&times;</b>
          </div>
        </article>

        <article>
          <div class="concept-heading">
            <span class="number">2</span>
            <div>
              <h2>Command</h2>
              <p>更醒目，手机桌面上最容易找到。</p>
            </div>
          </div>
          <div class="hero-icon dark-grid">
            <img src="/favicon-options/command.svg" alt="蓝色底、白色提示符和深色光标" />
          </div>
          <div class="sizes" aria-label="Command at actual sizes">
            <div><img class="size-32" src="/favicon-options/command.svg" alt="" /><span>32</span></div>
            <div><img class="size-16" src="/favicon-options/command.svg" alt="" /><span>16</span></div>
          </div>
          <div class="browser-tab">
            <img src="/favicon-options/command.svg" alt="" />
            <span>Agent · workspace</span>
            <b>&times;</b>
          </div>
        </article>

        <article>
          <div class="concept-heading">
            <span class="number">3</span>
            <div>
              <h2>Agent A</h2>
              <p>更像独立产品标记，终端感稍弱。</p>
            </div>
          </div>
          <div class="hero-icon dark-grid">
            <img src="/favicon-options/agent-a.svg" alt="深色底、白色字母 A 和蓝色横线" />
          </div>
          <div class="sizes" aria-label="Agent A at actual sizes">
            <div><img class="size-32" src="/favicon-options/agent-a.svg" alt="" /><span>32</span></div>
            <div><img class="size-16" src="/favicon-options/agent-a.svg" alt="" /><span>16</span></div>
          </div>
          <div class="browser-tab">
            <img src="/favicon-options/agent-a.svg" alt="" />
            <span>Agent · workspace</span>
            <b>&times;</b>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
